name: CI 與部署

on:
  pull_request:
  push:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 單元測試
        run: node --test tests/*.test.mjs
      - name: 檢查內建書庫
        run: node scripts/check.mjs content
      - name: 確認 dist/ 與原始碼同步
        run: |
          node scripts/bundle-check.mjs
          git diff --exit-code dist/

  smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    name: smoke (${{ matrix.browser }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 安裝無頭瀏覽器(只在 CI 臨時安裝,不寫進專案)
        run: |
          pip install playwright
          python -m playwright install --with-deps ${{ matrix.browser }}
      - name: 瀏覽器冒煙測試
        run: |
          node scripts/build-catalog.mjs
          python -m http.server 8000 &
          sleep 2
          python tests/smoke/smoke.py http://localhost:8000/ ${{ matrix.browser }}

  # 測試全部通過才部署(只在 main 的推送)
  deploy:
    needs: [test, smoke]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 產生 catalog.json 與 shell-manifest.js
        run: node scripts/build-catalog.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
