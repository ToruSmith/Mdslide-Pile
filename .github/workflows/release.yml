name: 發布新版

# 推送版本標籤(例如 git tag v1.4.0 && git push origin v1.4.0)時:
# 跑測試 → 組出範例書庫 → 打包 Mdslide書庫.zip → 建立 GitHub Release(說明取自 CHANGELOG)
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: 測試與檢查
        run: |
          node --test tests/*.test.mjs
          node scripts/check.mjs content
          node scripts/bundle-check.mjs
          git diff --exit-code dist/
      - name: 標籤與版本號一致
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - name: 組出範例書庫並打包
        run: |
          node scripts/build-starter.mjs build/Mdslide書庫
          node build/Mdslide書庫/mdslide-check.mjs build/Mdslide書庫
          cd build && python3 -m zipfile -c Mdslide書庫.zip Mdslide書庫/
      - name: 從 CHANGELOG 取出這一版的說明
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" '$0 ~ "^## "v" " {on=1; next} /^## / {on=0} on' CHANGELOG.md > build/notes.md
          test -s build/notes.md
      - name: 建立 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" build/Mdslide書庫.zip dist/mdslide-check.mjs --title "$GITHUB_REF_NAME" --notes-file build/notes.md
